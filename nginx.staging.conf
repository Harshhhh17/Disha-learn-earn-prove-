# ==============================================================================
# Disha Staging Nginx Reverse Proxy Configuration (DigitalOcean)
# ==============================================================================

# Rate Limiting Zones (Defined in http block)
# limit_req_zone $binary_remote_addr zone=staging_api_limit:10m rate=15r/s;
# limit_req_zone $binary_remote_addr zone=staging_auth_limit:10m rate=3r/s;

# 1. Frontend Web App (staging.yourdomain.com)
server {
    listen 80;
    listen [::]:80;
    server_name staging.yourdomain.com;

    # Redirect HTTP to HTTPS (uncomment after Certbot SSL provisioning)
    # return 301 https://$host$request_uri;

    root /var/www/disha;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static Assets Caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to sensitive files and directories
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /(backend|\.git|\.env|server\.py) {
        deny all;
        return 403;
    }
}

# 2. Backend API Gateway (api-staging.yourdomain.com)
server {
    listen 80;
    listen [::]:80;
    server_name api-staging.yourdomain.com;

    # Redirect HTTP to HTTPS (uncomment after Certbot SSL provisioning)
    # return 301 https://$host$request_uri;

    # Health Check (Unthrottled for load balancers & monitoring)
    location /health {
        proxy_pass http://127.0.0.1:4000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Auth Routes (Throttled to prevent brute force)
    location /api/auth/ {
        # limit_req zone=staging_auth_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:4000/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API Routes
    location /api/ {
        # limit_req zone=staging_api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Webhook timeout buffer
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
}
